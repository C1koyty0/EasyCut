workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify
  - package
  - release

default:
  interruptible: true

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  RUSTFLAGS: "-C debuginfo=1"

cache:
  key:
    files:
      - Cargo.lock
    prefix: "$CI_JOB_NAME"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/

verify:
  stage: verify
  image: rust:latest
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends clang libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
    - rustc --version
    - cargo fmt --all -- --check
    - cargo check --workspace --locked
    - cargo test --workspace --locked
    - cargo clippy --workspace --all-targets --locked -- -D warnings
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Requires a GitLab Runner registered on an Apple Silicon macOS host with the
# `macos-arm64` tag. X86_64 macOS is intentionally not built.
package:macos-arm64:
  stage: package
  tags:
    - macos-arm64
  script:
    - rustup target add aarch64-apple-darwin
    - cargo build --release --locked --target aarch64-apple-darwin -p easycut-core
    - mkdir -p dist/EasyCut-macos-arm64
    - cp target/aarch64-apple-darwin/release/easycut-core dist/EasyCut-macos-arm64/EasyCut
    - chmod +x dist/EasyCut-macos-arm64/EasyCut
    - tar -C dist -czf dist/EasyCut-macos-arm64.tar.gz EasyCut-macos-arm64
  artifacts:
    name: "EasyCut-macos-arm64-$CI_COMMIT_TAG"
    paths:
      - dist/EasyCut-macos-arm64.tar.gz
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG'

# Requires a GitLab Runner registered on a Windows 64-bit host with the
# `windows-amd64` tag. This is x86_64 (64-bit), not 32-bit x86.
package:windows-amd64:
  stage: package
  tags:
    - windows-amd64
  script:
    - rustup target add x86_64-pc-windows-msvc
    - cargo build --release --locked --target x86_64-pc-windows-msvc -p easycut-core
    - New-Item -ItemType Directory -Force -Path dist/EasyCut-windows-amd64 | Out-Null
    - Copy-Item target/x86_64-pc-windows-msvc/release/easycut-core.exe dist/EasyCut-windows-amd64/EasyCut.exe
    - Compress-Archive -Path dist/EasyCut-windows-amd64/EasyCut.exe -DestinationPath dist/EasyCut-windows-amd64.zip -Force
  artifacts:
    name: "EasyCut-windows-amd64-$CI_COMMIT_TAG"
    paths:
      - dist/EasyCut-windows-amd64.zip
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:macos-arm64
      artifacts: false
    - job: package:windows-amd64
      artifacts: false
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'EasyCut $CI_COMMIT_TAG'
    description: 'EasyCut desktop binaries for Apple Silicon macOS and Windows 64-bit.'
    assets:
      links:
        - name: EasyCut-macos-arm64.tar.gz
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=package%3Amacos-arm64'
          link_type: package
        - name: EasyCut-windows-amd64.zip
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=package%3Awindows-amd64'
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG'
