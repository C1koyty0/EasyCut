name: CI and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config \
            libasound2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libavfilter-dev \
            libswscale-dev libswresample-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-macos-arm64:
    name: Build macOS Apple Silicon
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install FFmpeg development libraries
        run: |
          brew install ffmpeg@7 pkg-config
          echo "$(brew --prefix ffmpeg@7)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --locked --target aarch64-apple-darwin -p easycut-core

      - name: Package
        run: |
          mkdir -p dist/EasyCut-macos-arm64
          cp target/aarch64-apple-darwin/release/easycut-core dist/EasyCut-macos-arm64/EasyCut
          chmod +x dist/EasyCut-macos-arm64/EasyCut
          tar -C dist -czf dist/EasyCut-macos-arm64.tar.gz EasyCut-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyCut-macos-arm64
          path: dist/EasyCut-macos-arm64.tar.gz
          if-no-files-found: error

  build-windows-amd64:
    name: Build Windows 64-bit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-ffmpeg-x64-windows-${{ hashFiles('.github/workflows/ci-release.yml') }}
          restore-keys: vcpkg-ffmpeg-x64-windows-

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgRoot = "C:\vcpkg"
          }
          $vcpkgCommit = "34823ada10080ddca99b60e85f80f55e18a44eea"
          git -C $vcpkgRoot fetch --depth 1 origin $vcpkgCommit
          git -C $vcpkgRoot checkout --force $vcpkgCommit
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$vcpkgRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $cacheDir = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $cacheDir
          & "$vcpkgRoot\vcpkg.exe" install ffmpeg:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg binary cache
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-ffmpeg-x64-windows-${{ hashFiles('.github/workflows/ci-release.yml') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p easycut-core

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/EasyCut-windows-amd64 | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/easycut-core.exe dist/EasyCut-windows-amd64/EasyCut.exe
          $dlls = Get-ChildItem -Path "$env:VCPKG_ROOT\installed\x64-windows\bin" -Filter "*.dll"
          if (-not $dlls) { throw "No FFmpeg runtime DLLs found in vcpkg installation" }
          $dlls | Copy-Item -Destination dist/EasyCut-windows-amd64
          Compress-Archive -Path dist/EasyCut-windows-amd64 -DestinationPath dist/EasyCut-windows-amd64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyCut-windows-amd64
          path: dist/EasyCut-windows-amd64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build-macos-arm64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: EasyCut-macos-arm64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EasyCut-windows-amd64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EasyCut-macos-arm64.tar.gz
            dist/EasyCut-windows-amd64.zip
